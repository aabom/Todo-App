name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: .NET (API, Blazor)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Known-vulnerable packages fail CI. Locally they stay warnings so they
      # never block a build, but they cannot reach main unnoticed.
      - name: Restore
        run: dotnet restore -p:WarningsNotAsErrors=

      - name: Build
        run: dotnet build --no-restore -p:WarningsNotAsErrors=

      - name: Test
        run: dotnet test --no-build --verbosity normal

  react:
    name: React client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/TodoApp.WebReact

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/TodoApp.WebReact/.nvmrc
          cache: npm
          cache-dependency-path: src/TodoApp.WebReact/package-lock.json

      - name: Install
        run: npm ci

      # Fails on a known high or critical advisory, like the .NET job does.
      - name: Audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
