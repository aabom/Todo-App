name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: .NET (API, Blazor)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Known-vulnerable packages fail CI. Locally they stay warnings so they
      # never block a build, but they cannot reach main unnoticed.
      - name: Restore
        run: dotnet restore -p:WarningsNotAsErrors=

      - name: Build
        run: dotnet build --no-restore -p:WarningsNotAsErrors=

      - name: Test
        run: dotnet test --no-build --verbosity normal

  react:
    name: React client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/TodoApp.WebReact

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/TodoApp.WebReact/.nvmrc
          cache: npm
          cache-dependency-path: src/TodoApp.WebReact/package-lock.json

      - name: Install
        run: npm ci

      # Fails on a known high or critical advisory, like the .NET job does.
      - name: Audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Docker images + end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        working-directory: .
        run: docker compose build

      - name: Start the stack
        working-directory: .
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && exit 0
            sleep 1
          done
          echo "The API did not become healthy" && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      # A real browser against the containers, through nginx and the /graphql proxy.
      - name: Test
        run: npm test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Stop
        if: always()
        working-directory: .
        run: docker compose down -v
