name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: .NET (API, Blazor)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Known-vulnerable packages fail CI. Locally they stay warnings so they
      # never block a build, but they cannot reach main unnoticed.
      - name: Restore
        run: dotnet restore -p:WarningsNotAsErrors=

      - name: Build
        run: dotnet build --no-restore -p:WarningsNotAsErrors=

      - name: Test
        run: dotnet test --no-build --verbosity normal

  react:
    name: React client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/TodoApp.WebReact

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/TodoApp.WebReact/.nvmrc
          cache: npm
          cache-dependency-path: src/TodoApp.WebReact/package-lock.json

      - name: Install
        run: npm ci

      # Fails on a known high or critical advisory, like the .NET job does.
      - name: Audit
        run: npm audit --audit-level=high

      # The types in src/gql are generated from the API's schema.graphql, which a .NET test
      # keeps in step with the C# types. Regenerating must change nothing.
      - name: Generated types are current
        run: |
          npm run codegen
          git status --porcelain -- src/gql
          test -z "$(git status --porcelain -- src/gql)" || {
            echo "src/gql is out of date: run 'npm run codegen' and commit the result."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose build

      # Start the stack and go through nginx, as a browser would: the page, then a
      # create and a read over the /graphql proxy against the API on its volume.
      - name: Smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          gql() {
            curl -sf http://localhost:8080/graphql -H 'Content-Type: application/json' -d "$1"
          }
          gql '{"query":"mutation { createTodo(input: { title: \"From CI\" }) { id } }"}'
          gql '{"query":"{ todos { title } }"}' | grep -q '"From CI"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
